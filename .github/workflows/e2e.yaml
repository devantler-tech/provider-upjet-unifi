name: End to End Testing

# A reviewer starts a run by submitting a pull request review whose body has a line
#
#   /test-examples="examples/cluster/network,examples/namespaced/wlan"
#
# The run tests exactly the commit the review was submitted on. It runs in the pull request's own
# context: a pull request from a fork gets a read-only token and no secrets, and caches stay scoped
# to the pull request, so the code under test never runs with this repository's write access or
# secrets. That event context is the trust boundary. The reviewer check below only decides who may
# spend runner time on a run.
"on":
  pull_request_review:
    types: [submitted]

# Deny by default; grant only what each job needs.
permissions: {}

env:
  GO_VERSION: "1.26.10"

jobs:
  select:
    # A review that does not mention the command never starts a runner.
    if: ${{ contains(github.event.review.body, '/test-examples="') }}
    runs-on: ubuntu-latest
    # Reads the reviewer's repository permission. Never checks out the code under test.
    permissions:
      contents: read
    outputs:
      paths: ${{ steps.select.outputs.paths }}
    steps:
      - name: Check the reviewer, the command and the reviewed commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEWED_SHA: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Paths are read as words, never expanded as globs.
          set -f
          # Every refusal below is a no-op: it writes no paths, so nothing is checked out or run,
          # and it explains itself instead of turning a review into a failed check.
          refuse() {
            echo "::warning::$1"
            printf 'Nothing to test: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # A reviewer the lookup cannot place, such as a review bot, is refused like any other
          # reviewer without write access.
          GRANTED=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq .permission 2>/dev/null) || GRANTED=unknown
          case "$GRANTED" in
            admin|write) ;;
            *) refuse "$REVIEWER has $GRANTED permission here; only reviewers with write or admin permission start an end-to-end run." ;;
          esac

          # Anchored to the start of a line, the usual slash-command convention, so a review that
          # merely quotes the command is not read as one.
          COMMAND=$(printf '%s\n' "$REVIEW_BODY" | tr -d '\r' | grep -oE '^/test-examples="[^"]+"' | head -n1 || true)
          if [ -z "$COMMAND" ]; then
            refuse 'no well-formed /test-examples="<paths>" line in this review.'
          fi

          # Test only the commit the reviewer saw. A review left on an older commit does not cover
          # what was pushed after it.
          if [ "$REVIEWED_SHA" != "$HEAD_SHA" ]; then
            refuse "the review is on $REVIEWED_SHA but the pull request head is $HEAD_SHA; review the current head to test it."
          fi

          # Only directories or files under examples/, named with plain characters and never
          # stepping outside it.
          PATHS=""
          for P in $(printf '%s\n' "$COMMAND" | cut -d '"' -f 2 | tr ',' ' '); do
            if ! printf '%s\n' "$P" | grep -qE '^examples(/[A-Za-z0-9_.-]+)*/?$' \
              || printf '%s\n' "$P" | grep -qE '(^|/)\.{1,2}(/|$)'; then
              refuse "'$P' is not a path under examples/."
            fi
            PATHS="${PATHS:+$PATHS }$P"
          done
          if [ -z "$PATHS" ]; then
            refuse 'the command names no paths.'
          fi

          echo "Testing $PATHS at $REVIEWED_SHA, requested by $REVIEWER."
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"

  uptest:
    needs: select
    if: ${{ needs.select.outputs.paths != '' }}
    runs-on: ubuntu-latest
    # A newer test request on the same pull request supersedes one still running. Set on this job,
    # not the workflow, so a review that requests nothing cancels nothing.
    concurrency:
      group: e2e-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Reads the code under test and nothing else: no write token, no persisted checkout
    # credential and no secrets.
    permissions:
      contents: read

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Checkout the reviewed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: List the example manifests
        id: examples
        env:
          PATHS: ${{ needs.select.outputs.paths }}
          REVIEWED_SHA: ${{ github.event.review.commit_id }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), not the reviewed commit $REVIEWED_SHA."
            exit 1
          fi
          LIST=""
          for P in $PATHS; do
            if [ ! -e "$P" ]; then
              echo "::error::$P does not exist at $REVIEWED_SHA."
              exit 1
            fi
            while IFS= read -r F; do
              if ! printf '%s\n' "$F" | grep -qE '^examples/[A-Za-z0-9_./-]+\.yaml$'; then
                echo "::error::Refusing the example file name '$F'."
                exit 1
              fi
              LIST="${LIST:+$LIST,}$F"
            done < <(find "$P" -type f -name '*.yaml' | sort)
          done
          if [ -z "$LIST" ]; then
            echo "::error::$PATHS holds no example manifests at $REVIEWED_SHA."
            exit 1
          fi
          echo "Examples: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Uptest
        env:
          # No controller credential reaches the code under test. cluster/test/setup.sh reads the
          # variable, so it is set, and empty.
          UPTEST_CLOUD_CREDENTIALS: ""
          UPTEST_EXAMPLE_LIST: ${{ steps.examples.outputs.list }}
          UPTEST_TEST_DIR: ./_output/controlplane-dump
          UPTEST_UPDATE_PARAMETER: ""
        run: make e2e

      - name: Collect Cluster Dump
        if: always()
        run: |
          make controlplane.dump

      - name: Upload Cluster Dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlplane-dump
          path: ./_output/controlplane-dump

      - name: Cleanup
        if: always()
        run: |
          eval "$(make --no-print-directory build.vars)"
          ${KUBECTL} delete managed --all || true
