---
name: Publish Provider Package

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Deny by default; grant only what the called workflow needs.
permissions: {}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Check out the release ref
        uses: actions/checkout@de0fac2e4500dabe0009f9d3d218dd2f0d17aa8f # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve and validate the release version
        id: release-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/release-version.sh "$REF_TYPE" "$REF_NAME" >> "$GITHUB_OUTPUT"

  publish-provider-package:
    # The reusable workflow pushes the xpkg to GHCR (docker login + crane copy)
    # using GHCR_PAT (the job's GITHUB_TOKEN), so it needs packages:write to
    # publish and contents:read to check out. It does no OIDC/cosign keyless
    # signing itself, so id-token:write is intentionally omitted HERE — the
    # signature is attached by the sign-provider-package job below.
    permissions:
      contents: read
      packages: write
    needs: resolve-version
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      repository: provider-upjet-unifi
      # Publish to ghcr.io/devantler-tech. The reusable workflow defaults
      # registry_org to "crossplane-contrib" (which we cannot push to → the
      # publish 403s with "permission_denied"), so it must be set explicitly.
      registry_org: devantler-tech
      version: ${{ needs.resolve-version.outputs.version }}
      # The security floor is deliberately not a dispatch input: a caller must
      # not be able to publish with an older, advisory-affected toolchain.
      go-version: "1.26.6"
      cleanup-disk: true
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_MIRROR_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_MIRROR_ACCESS_ID }}

  sign-provider-package:
    # Keyless cosign signature over the published package image — REQUIRED for
    # prod admission. The platform's verify-app-images ImageValidatingPolicy
    # (Kyverno) denies any unsigned ghcr.io/devantler-tech/* pod image, and the
    # ProviderRevision's package-runtime Deployment runs THIS image: v0.1.0
    # shipped unsigned and its pods were rejected at admission on prod
    # (2026-07-02), leaving the provider Deployment at 0/1. The upstream
    # reusable publish workflow does not sign, so the signature is attached
    # here right after it pushes. The Fulcio certificate identity this produces is
    #   https://github.com/devantler-tech/provider-upjet-unifi/.github/workflows/publish-provider-package.yml@refs/tags/<version>
    # which the platform policy accepts alongside its publish-app identity.
    needs:
      - resolve-version
      - publish-provider-package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Fulcio keyless certificate (OIDC)
      packages: write # push the signature to GHCR
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the package image (keyless)
        # --yes resolves the tag to its digest and signs the digest, so the
        # signature stays valid even if the tag is later moved. The validated
        # tag reaches the shell via env (never inline ${{ }} in run:) so ref
        # contents cannot inject shell syntax (zizmor template-injection).
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: cosign sign --yes "ghcr.io/devantler-tech/provider-upjet-unifi:${VERSION}"
