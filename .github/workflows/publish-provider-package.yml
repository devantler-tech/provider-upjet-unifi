---
name: Publish Provider Package

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Deny by default; grant only what the called workflow needs.
permissions: {}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Reject a non-tag ref before checking anything out
        id: reject-non-tag-ref
        # A skipped job reports SUCCESS, so this rejection fails rather than
        # sitting in an `if:` guard on the job: a dispatch against a branch —
        # the ref the Actions UI offers by default — would otherwise look like
        # a publish that produced nothing. It runs first so the rejection still
        # happens before anything is checked out. The ref reaches the shell via
        # env, never inline ${{ }}, so ref contents cannot inject shell syntax
        # (zizmor template-injection).
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "Releasing from tag $REF_NAME"
            exit 0
          fi
          echo "::error::This workflow publishes and signs a release, so it must run from a tag. Got $REF_TYPE '$REF_NAME'. Re-run it selecting a v* tag as the ref, or push a v* tag."
          exit 1
      - name: Check out the release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve and validate the release version
        id: release-version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/release-version.sh "$REF_TYPE" "$REF_NAME" >> "$GITHUB_OUTPUT"

  publish-provider-package:
    # Builds the xpkg and pushes it to ghcr.io/devantler-tech with steps this
    # repository owns, mirroring the build in ci.yml. It used to call the
    # community reusable workflow (crossplane-contrib/provider-workflows),
    # but that workflow uses actions by tag, and the organisation refuses any
    # action that is not pinned to a full commit SHA — a pin on the CALL does
    # not reach the actions inside it, so every release was refused before a
    # step ran (#56). Keep every `uses:` here a 40-hex commit; the publish
    # workflow test enforces it.
    #
    # Needs packages:write to push and contents:read to check out. It does no
    # OIDC/cosign keyless signing itself, so id-token:write is intentionally
    # omitted HERE — the signature is attached by the sign-provider-package
    # job below.
    permissions:
      contents: read
      packages: write
    needs: resolve-version
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDX_VERSION: "v0.34.1"
      # Publish to ghcr.io/devantler-tech, and never promote a channel from here.
      XPKG_REG_ORGS: ghcr.io/devantler-tech
      XPKG_REG_ORGS_NO_PROMOTE: ghcr.io/devantler-tech
      # The validated tag-derived version reaches the shell via env, never
      # inline ${{ }} in run:, so its contents cannot inject shell syntax.
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
          # A release must not run a builder binary restored from a cache.
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          # The build derives version metadata from history and tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The security floor is deliberately not a dispatch input: a caller
          # must not be able to publish with an older, advisory-affected
          # toolchain. No build cache either: a release must not be built from
          # a cache another run could have written.
          go-version: "1.26.6"
          cache: false

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Build Artifacts
        run: make -j2 XPKG_REG_ORGS="$XPKG_REG_ORGS" XPKG_REG_ORGS_NO_PROMOTE="$XPKG_REG_ORGS_NO_PROMOTE" BRANCH_NAME=main VERSION="$VERSION" build.all
        env:
          # We're using docker buildx, which doesn't actually load the images it
          # builds by default. Specifying --load does so.
          BUILD_ARGS: "--load"

      - name: Publish Artifacts
        run: make -j2 XPKG_REG_ORGS="$XPKG_REG_ORGS" XPKG_REG_ORGS_NO_PROMOTE="$XPKG_REG_ORGS_NO_PROMOTE" BRANCH_NAME=main VERSION="$VERSION" publish

  sign-provider-package:
    # Keyless cosign signature over the published package image — REQUIRED for
    # prod admission. The platform's verify-app-images ImageValidatingPolicy
    # (Kyverno) denies any unsigned ghcr.io/devantler-tech/* pod image, and the
    # ProviderRevision's package-runtime Deployment runs THIS image: v0.1.0
    # shipped unsigned and its pods were rejected at admission on prod
    # (2026-07-02), leaving the provider Deployment at 0/1. The publish job
    # above does not sign, so the signature is attached here right after it
    # pushes. The Fulcio certificate identity this produces is
    #   https://github.com/devantler-tech/provider-upjet-unifi/.github/workflows/publish-provider-package.yml@refs/tags/<version>
    # which the platform policy accepts alongside its publish-app identity.
    needs:
      - resolve-version
      - publish-provider-package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Fulcio keyless certificate (OIDC)
      packages: write # push the signature to GHCR
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the package image (keyless)
        # --yes resolves the tag to its digest and signs the digest, so the
        # signature stays valid even if the tag is later moved. The validated
        # tag reaches the shell via env (never inline ${{ }} in run:) so ref
        # contents cannot inject shell syntax (zizmor template-injection).
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: cosign sign --yes "ghcr.io/devantler-tech/provider-upjet-unifi:${VERSION}"
