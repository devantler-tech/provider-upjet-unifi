apiVersion: network.unifi.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-lan
spec:
  forProvider:
    name: example-lan
    subnet: 10.0.42.1/24
    vlan: 42
    # Set explicitly: the provider no longer defaults these for a new network
    # (upstream v0.59.0), so the example states the values it relies on.
    settingPreference: auto
    ipv6InterfaceType: none
    dhcpServer:
      enabled: true
      start: 10.0.42.10
      stop: 10.0.42.254
  providerConfigRef:
    name: default
