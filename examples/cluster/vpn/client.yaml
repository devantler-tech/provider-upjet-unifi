apiVersion: vpn.unifi.crossplane.io/v1alpha1
kind: Client
metadata:
  name: example-wireguard-client
spec:
  forProvider:
    name: example-wireguard-client
    enabled: true
    # The client's own address on the tunnel, in CIDR notation.
    subnet: 10.0.0.2/24
    wireguard:
      # The client's WireGuard private key, read from a Kubernetes Secret.
      # This provider requires it: the write-only key fields cannot be set.
      privateKeySecretRef:
        name: example-wireguard-client-keys
        namespace: crossplane-system
        key: private-key
      dnsServers:
        - 10.0.0.1
      peer:
        # The VPN server this client connects to (a documentation address).
        ip: 203.0.113.10
        port: 51820
        publicKeySecretRef:
          name: example-wireguard-client-keys
          namespace: crossplane-system
          key: peer-public-key
  providerConfigRef:
    name: default
