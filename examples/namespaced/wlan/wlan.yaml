apiVersion: wlan.unifi.m.crossplane.io/v1alpha1
kind: Wlan
metadata:
  name: example-wifi
  namespace: default
spec:
  forProvider:
    name: example-wifi
    security: wpapsk
    passphraseSecretRef:
      name: example-wifi-passphrase
      key: passphrase
    networkId: REPLACE_WITH_NETWORK_ID
    userGroupId: REPLACE_WITH_USER_GROUP_ID
    # The wrapped provider sets no default for the WLAN settings below, so a
    # new SSID takes the controller's value for any that is left unset.
    # Set here to the values earlier provider versions applied:
    wlanBand: both
    hideSsid: false
    groupRekey: 3600
    wpaEnc: ccmp
    # Left to the controller: wlanBands, bssTransition, no2ghzOui, enhancedIot,
    # pmfMode, wpa3Support and wpa3Transition. The controller picks values that
    # suit its version, the security mode and the access points, while the old
    # provider defaults turned PMF, WPA3 and BSS transition off. Set any of them
    # here to pin it.
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
