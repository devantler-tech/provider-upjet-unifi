apiVersion: wlan.unifi.m.crossplane.io/v1alpha1
kind: Wlan
metadata:
  name: example-wifi
  namespace: default
spec:
  forProvider:
    name: example-wifi
    security: wpapsk
    passphraseSecretRef:
      name: example-wifi-passphrase
      key: passphrase
    networkId: REPLACE_WITH_NETWORK_ID
    userGroupId: REPLACE_WITH_USER_GROUP_ID
    wlanBand: both
    # Set explicitly: upstream v0.59.0 no longer defaults these two for a new
    # SSID. The other WLAN defaults it removed are tracked on issue #73.
    groupRekey: 3600
    wpaEnc: ccmp
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
