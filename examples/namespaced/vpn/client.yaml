apiVersion: vpn.unifi.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: example-wireguard-client
  namespace: default
spec:
  forProvider:
    name: example-wireguard-client
    enabled: true
    # The client's own address on the tunnel, in CIDR notation.
    subnet: 10.0.0.2/24
    wireguard:
      # The client's WireGuard private key, read from a Secret in this
      # namespace. Always set it: this provider cannot set the write-only key
      # fields that could stand in for it, so a client without it fails to
      # reconcile.
      privateKeySecretRef:
        name: example-wireguard-client-keys
        key: private-key
      dnsServers:
        - 10.0.0.1
      peer:
        # The VPN server this client connects to (a documentation address).
        ip: 203.0.113.10
        port: 51820
        publicKeySecretRef:
          name: example-wireguard-client-keys
          key: peer-public-key
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
