apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: records.example.unifi.crossplane.io
spec:
  group: example.unifi.crossplane.io
  names:
    kind: Record
    listKind: RecordList
    plural: records
    singular: record
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                forProvider:
                  type: object
                  properties:
                    name:
                      description: The record name.
                      type: string
              required:
                - forProvider
